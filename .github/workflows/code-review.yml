name: Automated code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate review report
        id: review
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref || github.ref_name }}" --depth=1 || true
          changed_files="$(git diff --name-only "origin/${{ github.base_ref || github.ref_name }}"...HEAD || true)"
          if [ -z "$changed_files" ]; then
            changed_files="$(git diff --name-only HEAD~1..HEAD || true)"
          fi
          CHANGED_FILES="$changed_files" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path.cwd()
          files = [line.strip() for line in os.environ.get("CHANGED_FILES", "").splitlines() if line.strip()]
          secret_patterns = [
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"ghp_[A-Za-z0-9]{20,}"),
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"(?i)(api[_-]?key|token|secret|password)\s*[:=]\s*['\"][^'\"]{12,}['\"]"),
          ]
          private_fragments = {
              ".env",
              "config.yaml",
              "config.local.yaml",
              "logs/",
              "drafts/",
              "runtime/",
              "secrets/",
          }
          findings = []

          def add(severity, path, message):
              findings.append((severity, path, message))

          for rel in files:
              normalized = rel.replace("\\", "/")
              path = root / rel
              if "__pycache__" in normalized or normalized.endswith(".pyc"):
                  add("error", rel, "Generated Python cache files should not be committed.")
              if any(fragment in normalized for fragment in private_fragments):
                  add("error", rel, "Private config, logs, runtime data, or secret files should not be committed.")
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, FileNotFoundError, IsADirectoryError):
                  text = ""
              if normalized.startswith(".github/workflows/") and "pull_request_target" in text and "checkout@" in text:
                  add("warning", rel, "`pull_request_target` with checkout needs careful review before merge.")
              for pattern in secret_patterns:
                  if text and pattern.search(text):
                      add("error", rel, "Possible token, API key, password, or secret found.")
                      break

          lines = [
              "## Automated code review",
              "",
              "This review is generated by repository automation. It does not replace maintainer review.",
              "",
              f"Changed files reviewed: `{len(files)}`",
              "",
          ]
          if findings:
              lines += ["### Findings", ""]
              order = {"error": 0, "warning": 1, "info": 2}
              for severity, path, message in sorted(findings, key=lambda item: order.get(item[0], 99)):
                  lines.append(f"- **{severity.upper()}** `{path}`: {message}")
              lines.append("")
          else:
              lines += [
                  "No blocking findings detected by the automated checks.",
                  "",
                  "Maintainer checklist:",
                  "- Confirm the change matches the issue or PR scope.",
                  "- Confirm project-specific tests or validation were run.",
                  "- Review behavior manually for security-sensitive or user-facing changes.",
                  "",
              ]

          Path("code-review-report.md").write_text("\n".join(lines), encoding="utf-8")
          if any(severity == "error" for severity, _, _ in findings):
              raise SystemExit(1)
          PY

      - name: Post review comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("code-review-report.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Fail on blocking review findings
        if: steps.review.outcome == 'failure'
        run: exit 1
